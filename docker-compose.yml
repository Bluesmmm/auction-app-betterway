services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auction_app
      POSTGRES_USER: auction_app
      POSTGRES_PASSWORD: auction_app
    ports:
      - "5432:5432"
    volumes:
      - auction_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction_app -d auction_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - auction_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auction_postgres_data:
  auction_redis_data:
